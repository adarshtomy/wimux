[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-mux"
version = "0.1.0"
description = "Active-standby Wi-Fi failover daemon for NetworkManager"
requires-python = ">=3.11"
authors = [{ name = "adarshtomy", email = "adarshtomy0007@gmail.com" }]

[project.scripts]
wifi-mux = "wifi_mux.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]