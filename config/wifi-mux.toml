# Discover interface names and NetworkManager connection names with:
# nmcli device status
# nmcli connection show

[primary]
interface = "wlx00c0caafffca"
connection = "HEVEN_2G"

[backup]
interface = "<internal-interface>"
connection = "<backup-networkmanager-connection>"

[monitor]
interval = 3
failure_threshold = 3
recovery_threshold = 3

[notifications]
enabled = true

[logging]
level = "INFO"