# Discover interface names and NetworkManager connection names with:
# nmcli device status
# nmcli connection show

[primary]
interface = "<alfa-interface>"
connection = "<primary-networkmanager-connection>"

[backup]
interface = "<internal-interface>"
connection = "<backup-networkmanager-connection>"

[monitor]
interval = 3
failure_threshold = 3
recovery_threshold = 3
probe_host = "example.com"
probe_url = "https://connectivity-check.ubuntu.com/"
timeout = 5

[notifications]
enabled = true

[logging]
level = "INFO"